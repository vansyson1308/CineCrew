name: studio-offline-gate

# Offline engineering gate: fixture providers only, no secrets, no paid calls.
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Offline gate
        run: python -m pytest tests -q

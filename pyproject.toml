[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinecrew"
version = "1.0.0"
description = "Better Call CineCrew: Consistent Ultra-Long Narrative-to-Film Generation (ECCV 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sixun Dong" }]
keywords = ["video-generation", "multi-agent", "llm", "film", "text-to-video", "storytelling"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=2.0.0",
  "instructor>=1.0.0",
  "pydantic>=2.0.0",
  "PyYAML>=6.0",
  "Jinja2>=3.0.0",
]

[project.optional-dependencies]
studio = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "Pillow>=10.0"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Ironieser/CineCrew"
Repository = "https://github.com/Ironieser/CineCrew"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.studio" = ["templates/*.json"]
"src.agents" = ["*/*.yaml"]
